 solid #b6d8f0;border-radius:21px;padding:10px 25px;text-align:center;box-shadow:0 5px 0 #bddcf0;pointer-events:none}.speech:after{content:'';position:absolute;bottom:-12px;left:24px;width:18px;height:18px;transform:rotate(45deg);background:#fff;border-right:3px solid #b6d8f0;border-bottom:3px solid #b6d8f0}.speech small{font-size:9px;letter-spacing:2px;color:#7d8da3;display:block}.speech strong{font-size:25px;white-space:nowrap;display:block;margin:3px 0}.speech span{font-size:10px;color:#cc6286;white-space:nowrap}.gameToast{position:absolute;left:12px;right:12px;top:142px;text-align:center;font-size:14px;color:#376ba2;pointer-events:none;text-shadow:0 2px #fff;min-height:20px}.bigscore{font-size:54px;line-height:1;color:var(--pink);font-weight:700;margin:10px 0}.best{font-size:13px;color:#7d8da3}.copymsg{font-size:12px!important;min-height:0;color:#6684a0;margin:10px 0 0!important}.bigemoji{font-size:70px;margin:20px}.compact{padding:25px 22px}footer{text-align:center;color:#7d8da3;font-size:11px;line-height:1.7;margin-top:15px}footer a{color:var(--blue);display:inline-block;margin-right:8px}footer small{display:block;font-size:10px}.hidden{display:none!important}.arena:fullscreen{height:100dvh;width:100vw;border:0;border-radius:0}.arena:fullscreen .overlay{padding:25px}.arena:fullscreen .speech{top:25px}@keyframes bob{50%{transform:translateY(-5px) rotate(2deg)}}@media(max-height:740px){.app{padding-top:9px}h1{margin-top:10px;font-size:35px}.tagline{font-size:13px;margin:7px 0}.arena{height:max(420px,64dvh)}.portrait{height:96px}.card h2{font-size:24px}.card p{font-size:14px}.legend{margin:10px 0}.legend span{padding:6px}.primary{padding:10px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}

</style></head><body>
<div class="app" id="app"><header><span class="brand">🦦 THUR & NARNAS GAMES</span><div class="tools"><select id="language" aria-label="Idioma / Language"><option value="pt">PT-BR</option><option value="en">EN</option><option value="th">ไทย</option></select><button id="sound" class="icon" aria-label="Som / Sound" title="Sound">♪</button></div></header>
<h1>Love you,<br>stay delulu <span>💌</span></h1><p class="tagline" id="tagline"></p>
<div class="hud"><span class="pill">💌 <b id="score">0</b></span><span class="pill timer">⏱ <b id="time">30</b>s</span><span class="pill lives" id="lives" aria-label="Vidas">♥♥♥</span><button id="pause" class="icon" aria-label="Pausar / Pause">Ⅱ</button></div>
<section class="levelPanel" aria-live="polite"><strong id="levelLabel"></strong><span id="levelPhrase"></span><div class="levelTrack"><i id="levelProgress"></i></div></section>
<main class="arena" id="arena"><canvas id="canvas" tabindex="0" aria-label="Move the otter to catch love messages"></canvas><div id="gameToast" class="gameToast" aria-live="polite"></div><div class="speech" id="speech"><small>BOAT · MY SEA</small><strong>Love you 🤍</strong><span>…typing wedding vows 💍</span></div>
<div class="overlay" id="startScreen"><section class="card"><div class="ribbon" id="ribbon"></div><div class="portrait" id="portrait"></div><h2 id="startTitle"></h2><p id="startDesc"></p><div class="legend"><span id="legendLove"></span><span id="legendRing"></span><span id="legendCrab"></span><span id="legendControl"></span></div><button class="primary" id="play"></button><small class="cardFoot" id="cardFoot"></small></section></div>
<div class="overlay hidden" id="pauseScreen"><section class="card compact"><div class="bigemoji">🦦💤</div><h2 id="pauseTitle"></h2><p id="pauseText"></p><button class="primary" id="resume"></button></section></div>
<div class="overlay hidden" id="endScreen"><section class="card"><div class="ribbon" id="rankRibbon"></div><div class="portrait result" id="resultPortrait"></div><h2 id="resultTitle"></h2><div class="bigscore" id="finalScore"></div><p id="resultText"></p><div class="best" id="best"></div><button class="primary" id="again"></button><button class="secondary" id="share"></button><p class="copymsg" id="copymsg" role="status"></p></section></div>
</main><div class="controlbar"><span id="instructions"></span><button id="expand" class="icon" aria-label="Tela cheia / Fullscreen">⛶</button></div><footer><a href="https://vantevb.github.io/entreblsedesejos-midia/narna-games/" id="more"></a><span id="credit"></span><small id="disclaimer"></small></footer></div>
<script>
const BR='#8E5F3D', DK='#73492D', CR='#EED6B6', INK='#2A1A10', BL='#F59FAE', BLUE='#3B6EA8';
const heart=(x,y,s,c)=>`<path transform="translate(${x} ${y}) scale(${s})" d="M0 8 C-14 -6 -6 -20 0 -10 C6 -20 14 -6 0 8Z" fill="${c}"/>`;

function eyes(t){
  const L=-44,R=44,Y=-78;
  if(t==='happy') return `<path d="M${L-13} ${Y+4} Q${L} ${Y-12} ${L+13} ${Y+4}" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/><path d="M${R-13} ${Y+4} Q${R} ${Y-12} ${R+13} ${Y+4}" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>`;
  if(t==='sleep') return `<path d="M${L-13} ${Y-2} Q${L} ${Y+10} ${L+13} ${Y-2}" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/><path d="M${R-13} ${Y-2} Q${R} ${Y+10} ${R+13} ${Y-2}" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>`;
  if(t==='heart') return heart(L,Y,1.6,'#E84A7F')+heart(R,Y,1.6,'#E84A7F');
  if(t==='teary') return `<ellipse cx="${L}" cy="${Y}" rx="15" ry="16" fill="${INK}"/><circle cx="${L+5}" cy="${Y-6}" r="6" fill="#fff"/><circle cx="${L-5}" cy="${Y+6}" r="3" fill="#fff"/>
     <ellipse cx="${R}" cy="${Y}" rx="15" ry="16" fill="${INK}"/><circle cx="${R+5}" cy="${Y-6}" r="6" fill="#fff"/><circle cx="${R-5}" cy="${Y+6}" r="3" fill="#fff"/>
     <path d="M${L-8} ${Y+18} q-6 14 0 20 q6 -6 0 -20z" fill="#7CC4F2"/><path d="M${R+8} ${Y+18} q-6 14 0 20 q6 -6 0 -20z" fill="#7CC4F2"/>`;
  if(t==='wink') return `<ellipse cx="${L}" cy="${Y}" rx="11" ry="12" fill="${INK}"/><circle cx="${L+4}" cy="${Y-4}" r="4" fill="#fff"/><path d="M${R-13} ${Y+4} Q${R} ${Y-12} ${R+13} ${Y+4}" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>`;
  return `<ellipse cx="${L}" cy="${Y}" rx="11" ry="12" fill="${INK}"/><circle cx="${L+4}" cy="${Y-4}" r="4" fill="#fff"/><ellipse cx="${R}" cy="${Y}" rx="11" ry="12" fill="${INK}"/><circle cx="${R+4}" cy="${Y-4}" r="4" fill="#fff"/>`;
}
function mouth(t){
  if(t==='open') return `<path d="M-14 -26 Q0 -2 14 -26 Z" fill="#C2405E" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`;
  if(t==='sad') return `<path d="M-12 -18 Q0 -28 12 -18" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`;
  return `<path d="M-15 -22 Q-7 -12 0 -24 Q7 -12 15 -22" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`;
}
function paws(t){
  if(t==='wave') return `<path d="M70 20 Q120 -10 130 -70" stroke="${BR}" stroke-width="44" stroke-linecap="round" fill="none"/><ellipse cx="132" cy="-80" rx="26" ry="22" fill="${DK}"/><ellipse cx="-45" cy="30" rx="26" ry="20" fill="${DK}"/>
     <path d="M160 -110 q14 -6 20 6 M166 -78 q16 0 18 12" stroke="${BLUE}" stroke-width="8" stroke-linecap="round" fill="none"/>`;
  if(t==='heart') return heart(0,62,7,'#F06292')+`<ellipse cx="-58" cy="50" rx="26" ry="21" fill="${DK}"/><ellipse cx="58" cy="50" rx="26" ry="21" fill="${DK}"/>`;
  if(t==='wai') return `<ellipse cx="-13" cy="10" rx="18" ry="34" fill="${DK}" transform="rotate(-6 -13 10)"/><ellipse cx="13" cy="10" rx="18" ry="34" fill="${DK}" transform="rotate(6 13 10)"/>`;
  if(t==='shell') return `<g transform="translate(0 55) scale(1.6)"><path d="M0 -26 L-30 14 Q0 30 30 14 Z" fill="#FFB7C9" stroke="#F08AA6" stroke-width="3" stroke-linejoin="round"/><path d="M0 -26 L-15 18 M0 -26 L0 22 M0 -26 L15 18" stroke="#F08AA6" stroke-width="3"/></g><ellipse cx="-50" cy="45" rx="26" ry="21" fill="${DK}"/><ellipse cx="50" cy="45" rx="26" ry="21" fill="${DK}"/>`;
  if(t==='face') return `<ellipse cx="-80" cy="-30" rx="26" ry="22" fill="${DK}"/><ellipse cx="80" cy="-30" rx="26" ry="22" fill="${DK}"/>`;
  return `<ellipse cx="-45" cy="30" rx="26" ry="20" fill="${DK}"/><ellipse cx="45" cy="30" rx="26" ry="20" fill="${DK}"/>`;
}
function otter(o){
  return `<g>
   <ellipse cx="0" cy="80" rx="112" ry="108" fill="${BR}"/>
   <ellipse cx="0" cy="95" rx="74" ry="78" fill="${CR}"/>
   <ellipse cx="-60" cy="178" rx="34" ry="18" fill="${DK}"/><ellipse cx="60" cy="178" rx="34" ry="18" fill="${DK}"/>
   <ellipse cx="0" cy="-58" rx="118" ry="84" fill="${BR}"/>
   <circle cx="-106" cy="-92" r="15" fill="${DK}"/><circle cx="-106" cy="-92" r="7" fill="#D2A07A"/>
   <circle cx="106" cy="-92" r="15" fill="${DK}"/><circle cx="106" cy="-92" r="7" fill="#D2A07A"/>
   <path d="M-100 -30 Q-96 22 0 22 Q96 22 100 -30 Q70 -62 0 -60 Q-70 -62 -100 -30Z" fill="${CR}"/>
   ${eyes(o.eyes)}
   <ellipse cx="-74" cy="-34" rx="17" ry="9" fill="${BL}" opacity="${o.blush||.75}"/><ellipse cx="74" cy="-34" rx="17" ry="9" fill="${BL}" opacity="${o.blush||.75}"/>
   <ellipse cx="0" cy="-44" rx="19" ry="12" fill="${INK}"/>
   ${mouth(o.mouth)}
   <g stroke="#9C7656" stroke-width="3" stroke-linecap="round"><path d="M-34 -30 L-82 -40 M-34 -22 L-84 -20 M-34 -14 L-78 -2"/><path d="M34 -30 L82 -40 M34 -22 L84 -20 M34 -14 L78 -2"/></g>
   ${paws(o.paws)}
   ${o.hat||''}
  </g>`;
}
const water=`<path d="M-190 140 Q-142 115 -95 140 T0 140 T95 140 T190 140 Q200 200 150 215 Q0 235 -150 215 Q-200 200 -190 140Z" fill="#5DA9E6"/><path d="M-190 140 Q-142 115 -95 140 T0 140 T95 140 T190 140" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>`;
const nightcap=`<path d="M-70 -128 Q-10 -230 80 -190 Q40 -160 70 -125 Z" fill="#7FA8E0"/><circle cx="84" cy="-192" r="16" fill="#fff"/><path d="M-80 -128 Q0 -150 80 -128" stroke="#fff" stroke-width="16" stroke-linecap="round" fill="none"/>`;


const hats={
 boat:`<g transform="translate(0 -150)"><path d="M-80 0 L80 0 L50 40 L-50 40Z" fill="#fff" stroke="#3B6EA8" stroke-width="8" stroke-linejoin="round"/><path d="M0 0 L0 -85 L55 -10Z" fill="#fff" stroke="#3B6EA8" stroke-width="8" stroke-linejoin="round"/></g>`,
 party:`<g transform="translate(20 -140)"><path d="M-45 10 L0 -95 L45 10Z" fill="#F7B6CB" stroke="#E8638F" stroke-width="7"/><circle cy="-98" r="14" fill="#FFD36E"/></g>`,
 bow:`<g transform="translate(70 -125)"><path d="M0 0 L-45 -30 L-45 30Z M0 0 L45 -30 L45 30Z" fill="#E8638F"/><circle r="13" fill="#C2405E"/></g>`,
 crown:`<g transform="translate(0 -140)"><path d="M-60 20 L-60 -30 L-30 0 L0 -40 L30 0 L60 -30 L60 20Z" fill="#FFD36E" stroke="#E0A800" stroke-width="6" stroke-linejoin="round"/></g>`,
 flower:`<g transform="translate(-75 -120)">${[0,72,144,216,288].map(r=>`<ellipse rx="16" ry="26" cy="-22" transform="rotate(${r})" fill="#fff" stroke="#F7B6CB" stroke-width="3"/>`).join('')}<circle r="14" fill="#FFD36E"/></g>`,
 tri:`<g transform="translate(0 -150)"><path d="M-70 30 L0 -20 L70 30Z" fill="#fff" stroke="#3B6EA8" stroke-width="8" stroke-linejoin="round"/></g>`
};
const svgOf=(o)=>`<svg viewBox="-200 -260 400 420" xmlns="http://www.w3.org/2000/svg">${otter(o)}</svg>`;
const BOAT=svgOf({eyes:'happy',mouth:'open',paws:'wave',hat:hats.boat});
const BOAT_HIT=svgOf({eyes:'heart',mouth:'open',paws:'heart',hat:hats.boat,blush:1});


</script><script>

function drawItem(it,now){const x=it.x*W,y=it.y;ctx.save();ctx.translate(x,y);

function loop(now){const dt=Math.min(40,now-last);last=now;if(mode==='play'){elapsed+=dt;updateStage();time=Math.max(0,30-elapsed/1000);if(keys.ArrowLeft)target=Math.max(.12,target-dt*.0013);if(keys.ArrowRight)target=Math.min(.88,target+dt*.0013);otterX+=(target-otterX)*(1-Math.exp(-dt/65));hurt=Math.max(0,hurt-dt);spawnIn-=dt;if(spawnIn<=0){spawn();spawnIn=waveDelay()}const w=Math.min(116,W*.26),catchY=sea-w*.59;for(const it of items){it.vy=fallSpeed();it.y+=it.vy*dt/1000;const ix=it.x*W;if(!it.done&&Math.abs(it.y-catchY)<(it.k==='crab'?w*.19:w*.25)&&Math.abs(ix-otterX*W)<(it.k==='crab'?w*.30:w*.38)){it.done=true;if(it.k==='crab'){if(hurt<=0){lives--;hurt=650;pops.push({x:ix,y:it.y,life:800,label:'−1 ♥',color:'#e8638f'});tone(false);$('gameToast').textContent=lang==='pt'?'Ops! A realidade beliscou. 🦀':lang==='th'?'โอ๊ะ! ปูหนีบแล้ว 🦀':'Oops! Reality pinched. 🦀';toastLife=1800;}}else{const n=it.k==='ring'?5:1;score+=n;pops.push({x:ix,y:it.y,life:850,label:'+'+n+(it.k==='ring'?' 💍':' 🤍'),color:it.k==='ring'?'#d09b20':'#3b6ea8'});tone();cheer();}}if(it.y>sea+30)it.done=true;}items=items.filter(i=>!i.done);hud();if(time<=0||lives<=0)end();}bg(now);waves(now,false);for(const it of items)drawItem(it,now);drawOtter(now);waves(now,true);if(mode==='play'){for(const p of pops){p.life-=dt;p.y-=dt*.035;ctx.globalAlpha=Math.max(0,p.life/850);ctx.fillStyle=p.color;ctx.font='600 23px Fredoka,sans-serif';ctx.textAlign='center';ctx.fillText(p.label,p.x,p.y);ctx.globalAlpha=1;}pops=pops.filter(p=>p.life>0);}if(toastLife>0){toastLife-=dt;if(toastLife<=0)$('gameToast').textContent=''}requestAnimationFrame(loop)}

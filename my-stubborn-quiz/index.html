<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:title" content="Which My Stubborn character are you? 🦦"><meta property="og:description" content="A little quiz for Narnas &amp; THUR">
<title>My Stubborn Quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<style>
:root{--ink:#2F4A6B;--blue:#3B6EA8;--pink:#E8638F}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Fredoka,ui-rounded,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#DDF2FF,#FFF0F5)}
main{max-width:480px;margin:0 auto;padding:28px 16px 40px}
h1{text-align:center;margin:0;font-size:40px;line-height:1.1;color:#fff;-webkit-text-stroke:6px var(--blue);paint-order:stroke fill;text-shadow:0 5px 0 #8EC3EC}
.sub{text-align:center;font-size:17px;margin:12px 0 22px}
.card{background:#fff;border-radius:26px;padding:22px;box-shadow:0 8px 0 #BFE0F7}
.prog{height:10px;background:#E6F2FC;border-radius:10px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:#7FB8E8;width:0;transition:width .3s}
.q{font-size:22px;font-weight:600;color:var(--blue);margin:0 0 16px}
button{font:inherit;cursor:pointer;border:0}
.opt{display:block;width:100%;text-align:left;background:#F1F8FF;color:var(--ink);font-size:17px;padding:14px 16px;border-radius:18px;margin:10px 0;box-shadow:0 4px 0 #CFE6F8}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #CFE6F8}
.big{font-size:64px;text-align:center}
.rn{text-align:center;font-size:34px;font-weight:700;color:var(--pink);margin:6px 0}
.by{text-align:center;font-size:15px;color:#7D8DA3;margin-bottom:12px}
.rd{font-size:18px;line-height:1.45}
.row{display:flex;gap:10px;margin-top:18px}
.row button{flex:1;padding:14px;border-radius:18px;font-size:17px;font-weight:600;background:var(--blue);color:#fff;box-shadow:0 4px 0 #2A5180}
.row button.alt{background:#fff;color:var(--blue);border:2px solid #A9D3F2;box-shadow:0 4px 0 #CFE6F8}
.foot{text-align:center;font-size:13px;color:#7D8DA3;margin-top:22px}
.foot a{color:var(--blue)}
</style></head><body><main>
<h1>Which My Stubborn<br>character are you?</h1>
<p class="sub">6 questions · just for fun 🦦🤍</p>
<div class="card" id="box"></div>
<p class="foot">Fan-made for Narnas &amp; THUR by @entreblsedesejos · not official<br><a href="../narna-games/">More games →</a></p>
</main>
<script>
const R={
 S:{e:'🧊',n:'Sorn',by:'played by Boat 🦦',d:'Calm, organized and always in control… until someone chaotic walks in and turns your world upside down. You swear you don\'t like "kids", but your heart has other plans 🤭'},
 J:{e:'😈',n:'Jun',by:'played by Oat',d:'Playful, mischievous and a master at getting under people\'s skin. But behind the pranks there\'s a strong sense of right and wrong. Annoying? Maybe. Unforgettable? Definitely 💜'},
 T:{e:'🌸',n:'Tai & Champ',by:'the sweet side couple',d:'Gentle, soft and full of love. Less drama, more cute moments. You\'re the comfort character everyone needs 🥹'}
};
const Q=[
 ['A coworker eats your lunch by mistake. You…',[['S','Start labeling everything in the fridge 🏷️'],['J','Eat THEIR lunch tomorrow. Revenge 😈'],['T','Say it\'s okay and share your snack 🥹']]],
 ['Your desk looks like…',[['J','Chaos, with a prank hidden somewhere'],['T','Cute, with a photo of your favorite person'],['S','Perfectly organized and color-coded']]],
 ['Someone says "I don\'t like kids." You…',[['T','Smile: "you\'ll change your mind someday"'],['S','Nod. Same. 🙄'],['J','Take it as a personal challenge 😏']]],
 ['Your love language is…',[['S','Acts of service, but you\'ll never admit it\'s love'],['J','Teasing. If I annoy you, I like you'],['T','Quality time and soft words']]],
 ['Monday morning at work:',[['T','You bring snacks for everyone'],['J','You arrive just in time, already planning a prank'],['S','You arrive 15 minutes early with your coffee']]],
 ['Your friends describe you as…',[['J','Mischievous, but loyal to what\'s right'],['S','Serious, but secretly soft'],['T','The sweetheart of the group']]]
];
const box=document.getElementById('box');let i=0,sc={S:0,J:0,T:0};
function show(){
 if(i>=Q.length)return result();
 const [q,os]=Q[i];
 box.innerHTML=`<div class="prog"><i style="width:${i/Q.length*100}%"></i></div><p class="q">${i+1}. ${q}</p>`+os.map(([k,t])=>`<button class="opt" data-k="${k}">${t}</button>`).join('');
 box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{sc[b.dataset.k]++;i++;show()});
}
function result(){
 const k=['S','J','T'].sort((a,b)=>sc[b]-sc[a])[0],r=R[k];
 box.innerHTML=`<div class="big">${r.e}</div><div class="rn">You're ${r.n}!</div><div class="by">${r.by}</div><p class="rd">${r.d}</p>
 <div class="row"><button id="again">Play again</button><button class="alt" id="copy">Copy result</button></div>`;
 document.getElementById('again').onclick=()=>{i=0;sc={S:0,J:0,T:0};show()};
 document.getElementById('copy').onclick=async e=>{const t=`I got ${r.n} ${r.e} in the My Stubborn quiz! 🦦 Which one are you? ${location.href}`;
  try{await navigator.clipboard.writeText(t)}catch(_){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(__){}a.remove()}
  e.target.textContent='Copied! 🤍'};
}
show();
</script></body></html>

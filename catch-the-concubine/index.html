#exit span{writing-mode:vertical-rl;font-weight:700;color:#E8638F;font-size:15px;letter-spacing:.05em}
.c{position:absolute;width:86px;height:96px;margin:-48px 0 0 -43px;cursor:pointer;transition:transform .15s}
.c svg{width:100%;height:100%;overflow:visible;pointer-events:none}
.c.bob svg{animation:bob .35s infinite alternate ease-in-out}
@keyframes bob{to{transform:translateY(-5px) rotate(-3deg)}}
.c.caught{transform:scale(1.15)}
.say{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);white-space:nowrap;background:#fff;border-radius:12px;padding:3px 8px;font-size:12px;font-weight:600;color:#7A2F4A;box-shadow:0 2px 0 #F2C5D4;pointer-events:none}
.fx{position:absolute;font-weight:700;font-size:22px;pointer-events:none;animation:up .8s forwards}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
.foot{text-align:center;font-size:13px;color:#7D8DA3;padding:4px 0 10px}
.foot a{color:#3B6EA8}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(221,242,255,.85);z-index:20;padding:16px}
.ov[hidden]{display:none}
.card{background:#fff;border-radius:26px;padding:22px;max-width:400px;width:100%;text-align:center;box-shadow:0 8px 0 #BFE0F7}
.card h2{margin:0 0 8px;color:#3B6EA8;font-size:24px}
.card p{margin:6px 0;font-size:16px;line-height:1.4}
.rules{text-align:left;background:#F1F8FF;border-radius:16px;padding:10px 14px;margin:12px 0;font-size:15px;line-height:1.6}
.big{font-size:56px;font-weight:700;color:#E8638F}
button{font:inherit;cursor:pointer;border:0}
.btn{background:#3B6EA8;color:#fff;font-weight:600;font-size:18px;padding:12px 26px;border-radius:18px;box-shadow:0 4px 0 #2A5180;margin:6px 4px}
.btn.alt{background:#fff;color:#3B6EA8;border:2px solid #A9D3F2;box-shadow:0 4px 0 #CFE6F8}
</style></head><body>

 </div></div>

<script src="../shared/lang.js"></script>
<script src="../shared/otter.js"></script>
<script>
const $=id=>document.getElementById(id), stage=$('stage');
const bow=`<g transform="translate(-62 -128)"><path d="M0 0 L-26 -16 L-26 16Z M0 0 L26 -16 L26 16Z" fill="#F06292" stroke="#C2405E" stroke-width="3" stroke-linejoin="round"/><circle r="8" fill="#C2405E"/></g>`;
const bag=`<g transform="translate(118 70) rotate(8)"><rect x="-38" y="-30" width="76" height="60" rx="10" fill="#F29BB6" stroke="#C2405E" stroke-width="5"/><path d="M-14 -30 v-14 h28 v14" fill="none" stroke="#C2405E" stroke-width="6"/><path d="M-38 0 h76" stroke="#C2405E" stroke-width="4"/><text x="0" y="22" font-size="26" text-anchor="middle">💔</text></g>`;
const RUN=`<svg viewBox="-200 -260 400 460">${otter({eyes:'teary',mouth:'sad',paws:'default',hat:bow})}${bag}</svg>`;
const STAY=`<svg viewBox="-200 -260 400 460">${otter({eyes:'happy',mouth:'smile',paws:'heart'})}</svg>`;
const SWIM=`<svg viewBox="-200 -260 400 460">${otter({eyes:'happy',mouth:'open',paws:'wave'})}</svg>`;
let best=0;try{best=+localStorage.getItem('concubineBest')||0}catch(e){} $('best').textContent=best;
let items=[],score=0,lives=3,running=false,last=0,elapsed=0,spawnT=0,raf;
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function fx(x,y,t,c){const d=document.createElement('div');d.className='fx';d.textContent=t;d.style.left=x+'px';d.style.top=y+'px';d.style.color=c;stage.appendChild(d);setTimeout(()=>d.remove(),800)}
function say(el,t,ms){const s=document.createElement('div');s.className='say';s.textContent=t;el.appendChild(s);setTimeout(()=>s.remove(),ms||900)}
function spawn(){
 const W=stage.clientWidth,H=stage.clientHeight,decoy=elapsed>6&&Math.random()<Math.min(.35,.12+elapsed/120);
 const el=document.createElement('div');el.className='c bob';el.innerHTML=decoy?SWIM:RUN;
 const it={el,decoy,x:60,y:70+Math.random()*(H-140),vx:(decoy?40:55)+Math.min(150,elapsed*3.2)+Math.random()*25,wob:Math.random()*6,done:false};
 if(decoy){it.x=70+Math.random()*(W-200);it.vx*=(Math.random()<.5?-.5:.5)}
 el.style.left=it.x+'px';el.style.top=it.y+'px';
 el.addEventListener('pointerdown',e=>{e.preventDefault();hit(it)});
 stage.appendChild(el);items.push(it);
}
function hit(it){
 if(it.done||!running)return;it.done=true;
 if(it.decoy){score=Math.max(0,score-1);say(it.el,T('oops'));fx(it.x,it.y-50,'−1','#E8638F');}
 else{score++;it.el.innerHTML=STAY;it.el.classList.add('caught');it.el.classList.remove('bob');say(it.el,rnd(T('caught')));fx(it.x,it.y-50,'+1','#3B6EA8');}
 $('sc').textContent=score;setTimeout(()=>{it.el.style.opacity='0';it.el.style.transition='opacity .3s'},600);setTimeout(()=>it.el.remove(),950);
}
function loop(t){
 if(!running)return;const dt=Math.min(.05,(t-last)/1000||0);last=t;elapsed+=dt;
 const W=stage.clientWidth,H=stage.clientHeight;
 spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(.45,1.5-elapsed*.025)+Math.random()*.5;}
 for(const it of items){if(it.done)continue;it.x+=it.vx*dt;it.wob+=dt*4;const y=it.y+Math.sin(it.wob)*10;it.el.style.left=it.x+'px';it.el.style.top=y+'px';
  if(it.decoy&&(it.x<60||it.x>W-110))it.vx*=-1;
  if(it.decoy&&Math.random()<dt*.15){it.done=true;it.el.style.transition='opacity .4s';it.el.style.opacity='0';setTimeout(()=>it.el.remove(),450)}
  if(!it.decoy&&it.x>W-60){it.done=true;lives--;say(it.el,T('bye'),700);fx(W-80,y-40,'💔','#E8638F');setLives();setTimeout(()=>it.el.remove(),700);if(lives<=0){end();return}}}
 items=items.filter(i=>!i.done||i.el.isConnected);raf=requestAnimationFrame(loop);
}
function setLives(){$('lives').textContent='💜'.repeat(Math.max(0,lives))+'🖤'.repeat(3-Math.max(0,lives))}
function start(){items.forEach(i=>i.el.remove());items=[];score=0;lives=3;elapsed=0;spawnT=.3;last=performance.now();$('sc').textContent=0;setLives();$('start').hidden=true;$('end').hidden=true;$('copied').hidden=true;running=true;raf=requestAnimationFrame(loop)}
function end(){running=false;cancelAnimationFrame(raf);if(score>best){best=score;try{localStorage.setItem('concubineBest',best)}catch(e){};$('best').textContent=best}
 $('final').textContent=score;const m=T(score>=25?'e3':score>=10?'e2':'e1');$('title').textContent=m[0];$('emsg').textContent=m[1];$('end').hidden=false}
$('go').onclick=start;$('again').onclick=start;
$('copy').onclick=async()=>{const t=T('share',{n:score})+' '+location.href.split('?')[0];try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}$('copied').hidden=false};
</script></body></html>

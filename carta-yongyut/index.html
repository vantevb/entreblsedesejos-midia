<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Calm Sea Letter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap">
<style>
/* Layout: one moonlit sea — sky band with the otter floating on the waves, then a letter in a bottle-glass card, then one button to make peace. Single deliberate night look. */
:root{
  --sky-top:#0d2240;
  --sky-low:#1f4e79;
  --sea:#1b6f9a;
  --sea-deep:#0e3f63;
  --foam:#e8f6ff;
  --paper:#fff8ec;
  --ink:#2a2140;
  --ink-soft:#5c5270;
  --coral:#ff8fa3;
  --sun:#ffd27a;
  --otter:#8a5a3b;
  --otter-belly:#d9b48f;
  --display:"Mali","Sarabun",system-ui,sans-serif;
  --body:"Sarabun","Mali",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;background:var(--sea-deep);color:var(--foam);font-family:var(--body);
  font-size:17px;line-height:1.7;overflow-x:hidden;
}
.sky{
  position:relative;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-low) 78%,var(--sea) 100%);
  padding-block:40px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  text-align:center;overflow:hidden;
}
.moon{position:absolute;top:28px;right:max(24px,8vw);width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff7dc,var(--sun));box-shadow:0 0 40px 10px rgba(255,210,122,.35)}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--foam);opacity:.7;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.kicker{font-family:var(--display);font-weight:600;color:var(--sun);letter-spacing:.06em;font-size:14px;margin:0}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,7vw,52px);line-height:1.2;margin:.2em auto .1em;max-width:16ch;text-wrap:balance}
.sub{margin:0 auto;color:#bfe0f5;max-width:36ch}
.scene{position:relative;height:230px;max-width:640px;margin:8px auto 0}
.otter{position:absolute;left:50%;bottom:58px;width:170px;transform:translateX(-50%);animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(-50%,0) rotate(-3deg)}50%{transform:translate(-50%,-10px) rotate(3deg)}}
.waves{position:absolute;left:-10%;width:120%;bottom:0;height:110px}
.waves path{animation:drift 7s linear infinite}
.waves .w2{animation-duration:10s;animation-direction:reverse}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-200px)}}
.sea{background:linear-gradient(180deg,var(--sea) 0%,var(--sea-deep) 60%);
  padding-block:8px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.langs{display:flex;justify-content:center;gap:8px;margin:0 auto 18px;flex-wrap:wrap}
.langs button{font:600 14px var(--body);border:1.5px solid rgba(232,246,255,.5);background:transparent;color:var(--foam);
  border-radius:999px;padding:6px 16px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--foam);color:var(--sea-deep);border-color:var(--foam)}
.letter{max-width:620px;margin:0 auto;background:var(--paper);color:var(--ink);border-radius:18px;
  padding:clamp(22px,5vw,40px);box-shadow:0 18px 40px rgba(4,20,40,.45);position:relative}
.letter::before{content:"";position:absolute;inset:10px;border:1.5px dashed rgba(42,33,64,.15);border-radius:12px;pointer-events:none}
.letter h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0 0 .6em;color:var(--sea-deep)}
.letter p{margin:0 0 1em;max-width:62ch}
.letter .sign{font-family:var(--display);font-weight:600;color:var(--ink-soft);margin-top:1.4em}
.potato{white-space:nowrap}
.peace{display:flex;flex-direction:column;align-items:center;gap:14px;margin:30px auto 0;text-align:center;max-width:620px}
.peace p{margin:0;font-family:var(--display);font-size:20px}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{font:700 17px var(--display);border:0;border-radius:999px;padding:12px 26px;cursor:pointer;
  background:var(--coral);color:var(--ink);box-shadow:0 6px 0 #c9677b;transition:transform .15s}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #c9677b}
.btn.alt{background:var(--sun);box-shadow:0 6px 0 #c99a45}
.btn:focus-visible,.langs button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.done{font-family:var(--display);font-size:22px;color:var(--sun);min-height:1.5em}
.heart{position:fixed;bottom:-40px;font-size:28px;pointer-events:none;animation:rise 3.5s ease-out forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
footer{text-align:center;color:#9cc6e2;font-size:13px;margin-top:36px}
/* ---- Intro: the sea parts to deliver the letter ---- */
#intro{position:fixed;inset:0;z-index:50;overflow:hidden;background:var(--sky-top);display:grid;place-items:center;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.curtain{position:absolute;top:-5%;height:110%;width:56%;transition:transform 2.1s cubic-bezier(.7,0,.2,1)}
.curtain.l{left:0}.curtain.r{right:0}
.curtain .body{position:absolute;inset:0}
.curtain.l .body{right:7%;background:linear-gradient(90deg,var(--sea-deep),var(--sea))}
.curtain.r .body{left:7%;background:linear-gradient(270deg,var(--sea-deep),var(--sea))}
.edge{position:absolute;top:0;height:100%;width:14%}
.curtain.l .edge{right:0}.curtain.r .edge{left:0;transform:scaleX(-1)}
.edge path{animation:lap 2.6s ease-in-out infinite}
.edge .f{animation-duration:3.4s;animation-delay:-.8s}
@keyframes lap{50%{transform:translateX(-10px)}}
.sparkle{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--foam);opacity:.0;animation:spark 4s ease-in-out infinite}
@keyframes spark{40%{opacity:.8}80%{opacity:0}}
#intro.open .curtain.l{transform:translateX(-108%)}
#intro.open .curtain.r{transform:translateX(108%)}
.invite{position:relative;z-index:2;text-align:center;max-width:420px;transition:opacity .7s ease,transform .9s ease}
#intro.open .invite{opacity:0;transform:translateY(-40px) scale(.9)}
.bottle{width:130px;display:block;margin:0 auto 14px;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
@keyframes float{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-12px) rotate(6deg)}}
.invite h2{font-family:var(--display);font-size:clamp(24px,6vw,34px);margin:0 0 .2em;text-wrap:balance}
.invite p{margin:0 0 22px;color:#bfe0f5}
.open-btn{font:700 19px var(--display);border:0;border-radius:999px;padding:14px 30px;cursor:pointer;
  background:var(--foam);color:var(--sea-deep);box-shadow:0 0 0 0 rgba(232,246,255,.6);animation:pulse 2.2s ease-out infinite}
@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(232,246,255,0)}100%{box-shadow:0 0 0 0 rgba(232,246,255,0)}}
.open-btn:focus-visible{outline:3px solid var(--sun);outline-offset:4px}
.hint{font-size:13px;color:#8fb8d6;margin-top:14px}
.splash{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;pointer-events:none;
  box-shadow:0 0 0 0 rgba(232,246,255,.9);opacity:0}
#intro.open .splash{animation:ring 1.4s ease-out forwards}
#intro.open .splash.s2{animation-delay:.25s}
@keyframes ring{0%{opacity:1;box-shadow:0 0 0 0 rgba(232,246,255,.9)}100%{opacity:0;box-shadow:0 0 0 70vmax rgba(232,246,255,0)}}
.mute{position:fixed;z-index:40;right:max(16px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(232,246,255,.5);background:rgba(14,63,99,.75);color:var(--foam);
  font-size:20px;cursor:pointer;backdrop-filter:blur(6px)}
.mute:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.curtain{transition:opacity .4s}#intro.open .curtain{opacity:0}}
</style>

<script>
const T={
th:{introTitle:"มีจดหมายลอยมาตามทะเล 🌊",introSub:"ถึงยงยุทธ จากแฟนคลับคนหนึ่งในบราซิล",introBtn:"เปิดจดหมาย 💌",introHint:"เปิดเสียงไว้นะคะ 🔊",kicker:"จดหมายจากบราซิล 🇧🇷",title:"ทะเลสงบแล้วนะคะ 🌊",sub:"จดหมายเล็กๆ จากแฟนคลับเสียงดังคนหนึ่ง",
ask:"ยกโทษให้ฉันไหมคะ?",yes1:"ยกโทษให้ 💜",yes2:"ก็ได้ แต่ห้ามดื้ออีกนะ 😤",
done:"เย้! ทะเลกลับมาสดใสแล้ว 🦦💜",foot:"ทำด้วยรักจากบราซิล · ไม่มีมันฝรั่งได้รับบาดเจ็บ 🥔",
letter:`<h2>ถึงยงยุทธ 🦦💌</h2>
<p>นี่คือจดหมายจากแฟนคลับเสียงดังจากบราซิลค่ะ ที่สัญญาว่าจะไม่วุ่นวายอีกแล้ว (จะพยายามนะคะ 😅)</p>
<p>ฉันรู้ว่าวันศุกร์ฉันทำให้ทะเลของคุณมีคลื่นแรงไปหน่อย ตอนนี้ทะเลสงบแล้ว และฉันอยากให้มันเป็นทะเลที่มีแต่ความสุขค่ะ 🌊</p>
<p>ถ้าคุณยังโกรธอยู่ ฉันพร้อมไปร้องเพลงขอโทษใต้หน้าต่างบ้านคุณ แต่ขออย่างเดียว อย่าไล่ฉันไปปลูกมันฝรั่งกลางมหาสมุทรนะคะ <span class="potato">🥔😂</span></p>
<p>ขอบคุณที่อดทนกับพวกเรานะคะ พักผ่อนเยอะๆ แล้วเจอกันที่ My Sea ค่ะ 💜</p>
<p class="sign">จากแฟนคลับที่ (พยายาม) เป็นเด็กดี<br>Vick 🦦</p>`},
en:{introTitle:"A letter drifted in from the sea 🌊",introSub:"For Yongyut, from a fan in Brazil",introBtn:"Open the letter 💌",introHint:"Turn your sound on 🔊",kicker:"A letter from Brazil 🇧🇷",title:"The sea is calm now 🌊",sub:"A little letter from one very loud fan",
ask:"Will you forgive me?",yes1:"I forgive you 💜",yes2:"Fine, but behave 😤",
done:"Yay! The sea is shining again 🦦💜",foot:"Made with love from Brazil · No potatoes were harmed 🥔",
letter:`<h2>Dear Yongyut 🦦💌</h2>
<p>This is a letter from a loud fan in Brazil who promises not to cause any more chaos (I'll try, okay? 😅)</p>
<p>I know that on Friday I made your sea a little too stormy. The sea is calm now, and I want it to be a sea full of happiness 🌊</p>
<p>If you're still upset, I'm ready to sing an apology serenade under your window. I only ask one thing: please don't send me off to plant potatoes in the middle of the ocean <span class="potato">🥔😂</span></p>
<p>Thank you for being patient with us. Get lots of rest, and see you at My Sea 💜</p>
<p class="sign">From the fan who's (trying to be) a good girl,<br>Vick 🦦</p>`},
pt:{introTitle:"Uma carta chegou pelo mar 🌊",introSub:"Para o Yongyut, de uma fã no Brasil",introBtn:"Abrir a carta 💌",introHint:"Liga o som 🔊",kicker:"Uma carta do Brasil 🇧🇷",title:"O mar está calmo agora 🌊",sub:"Uma cartinha de uma fã muito barulhenta",
ask:"Você me perdoa?",yes1:"Perdoo 💜",yes2:"Tá, mas comporte-se 😤",
done:"Eba! O mar voltou a brilhar 🦦💜",foot:"Feito com amor no Brasil · Nenhuma batata foi ferida 🥔",
letter:`<h2>Querido Yongyut 🦦💌</h2>
<p>Aqui é uma fã barulhenta do Brasil, que promete não fazer mais bagunça (vou tentar, tá? 😅)</p>
<p>Sei que na sexta eu deixei o seu mar com ondas fortes demais. Agora o mar está calmo, e eu quero que ele seja só de alegria 🌊</p>
<p>Se você ainda estiver bravo, estou pronta pra cantar uma serenata de desculpas debaixo da sua janela. Só peço uma coisa: não me mande plantar batata no meio do oceano <span class="potato">🥔😂</span></p>
<p>Obrigada pela paciência com a gente. Descanse bastante, e nos vemos no My Sea 💜</p>
<p class="sign">Da fã que está (tentando) ser uma boa menina,<br>Vick 🦦</p>`}
};
let lang="th";
function render(){
  const t=T[lang];
  document.documentElement.lang=lang==="pt"?"pt-BR":lang;
  document.querySelectorAll("[data-k]").forEach(el=>{el.textContent=t[el.dataset.k]});
  document.getElementById("letter").innerHTML=t.letter;
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  const d=document.getElementById("done"); if(d.dataset.on) d.textContent=t.done;
}
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;render()}));
function hearts(){
  const set=["💜","🦦","🌊","💙","✨","🐚"];
  for(let i=0;i<18;i++){const h=document.createElement("span");h.className="heart";
    h.textContent=set[i%set.length];h.style.left=(Math.random()*92+2)+"vw";
    h.style.animationDelay=(Math.random()*0.8)+"s";document.body.appendChild(h);setTimeout(()=>h.remove(),4500)}
}
["yes1","yes2"].forEach(id=>document.getElementById(id).addEventListener("click",()=>{
  const d=document.getElementById("done");d.dataset.on="1";d.textContent=T[lang].done;hearts();
}));
render();

/* ---- Ocean sound, synthesized live (no files needed) ---- */
let ac=null,master=null,muted=false;
function noiseBuffer(ctx,sec){
  const len=ctx.sampleRate*sec,buf=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0;i<len;i++){const w=Math.random()*2-1; // pink noise
      b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;
      d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926;}}
  return buf;
}
function startOcean(){
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=.9;master.connect(ac.destination);
    const buf=noiseBuffer(ac,6);
    // rolling ambient surf: lowpassed noise breathing in slow swells
    const amb=ac.createBufferSource();amb.buffer=buf;amb.loop=true;
    const lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=700;lp.Q.value=.4;
    const ag=ac.createGain();ag.gain.value=.22;
    const lfo=ac.createOscillator();lfo.frequency.value=.11;const lfoG=ac.createGain();lfoG.gain.value=.16;
    lfo.connect(lfoG);lfoG.connect(ag.gain);
    const lfo2=ac.createOscillator();lfo2.frequency.value=.11;const lfo2G=ac.createGain();lfo2G.gain.value=450;
    lfo2.connect(lfo2G);lfo2G.connect(lp.frequency);
    amb.connect(lp);lp.connect(ag);ag.connect(master);amb.start();lfo.start();lfo2.start();
    // foam hiss on top
    const hs=ac.createBufferSource();hs.buffer=buf;hs.loop=true;hs.playbackRate.value=1.3;
    const hp=ac.createBiquadFilter();hp.type="highpass";hp.frequency.value=3000;
    const hg=ac.createGain();hg.gain.value=.025;const lfo3G=ac.createGain();lfo3G.gain.value=.02;
    lfo.connect(lfo3G);lfo3G.connect(hg.gain);
    hs.connect(hp);hp.connect(hg);hg.connect(master);hs.start();
    // the big wave that parts the sea
    crash(ac.currentTime+.05,1);crash(ac.currentTime+1.1,.6);
    document.getElementById("mute").hidden=false;
  }catch(e){}
}
function crash(t,amt){
  const src=ac.createBufferSource();src.buffer=noiseBuffer(ac,5);
  const f=ac.createBiquadFilter();f.type="lowpass";f.Q.value=.7;
  f.frequency.setValueAtTime(250,t);f.frequency.exponentialRampToValueAtTime(3200,t+.9);f.frequency.exponentialRampToValueAtTime(500,t+4.2);
  const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.95*amt,t+.8);
  g.gain.exponentialRampToValueAtTime(.35*amt,t+2);g.gain.exponentialRampToValueAtTime(.0001,t+4.6);
  const p=ac.createStereoPanner?ac.createStereoPanner():null;
  src.connect(f);f.connect(g);
  if(p){p.pan.setValueAtTime(-.6,t);p.pan.linearRampToValueAtTime(.6,t+3);g.connect(p);p.connect(master)}else g.connect(master);
  src.start(t);src.stop(t+5);
}
document.getElementById("mute").addEventListener("click",()=>{
  if(!master)return;muted=!muted;
  master.gain.setTargetAtTime(muted?0:.9,ac.currentTime,.2);
  document.getElementById("mute").textContent=muted?"🔇":"🔊";
});
document.getElementById("openBtn").addEventListener("click",()=>{
  startOcean();
  const intro=document.getElementById("intro");intro.classList.add("open");
  setTimeout(()=>{intro.remove();hearts();},2200);
});
</script>
